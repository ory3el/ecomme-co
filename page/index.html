<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecomme</title>

<link rel="stylesheet" href="/files/no-login/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" id="favicon" type="image/png" sizes="144x144" href="/images/favicon-light.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Marck+Script&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	
</head>
<body>

<div id="index-content"></div>
	
<script>
    fetch('../files/no-login/index.html')
        .then(response => response.text())
        .then(response => {
            if (!response.ok) throw new Error("Erro ao carregar o arquivo");
            return response.text();
        })
        .then(data => {
            document.getElementById('index-content').innerHTML = data;
			
            const script = document.createElement('script');
            script.src = '/files/no-login/script.js';
            document.body.appendChild(script);
        })
        .catch(error => {
            console.error("Erro no carregamento:", error);
            document.getElementById('index-content').innerHTML = "<h1>Erro ao carregar a página. Verifique o console.</h1>";
        });
</script>
	
</body>
</html>
