<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecomme</title>

<link rel="stylesheet" href="../files/no-login/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" id="favicon" type="image/png" href="../images/favicon-light.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	
</head>
<body>
<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="logo_dark">
       <button onclick="window.scrollTo({top:0,behavior:'smooth'})">
         <img src="./images/mainlogo_dark.png" style="position: relative; top: 0px; width: 200px; height: auto; display: block;" alt="Ecomme"/>
       </button>
    </div>
    <nav class="nav-main">
      <a href="/" class="active">Início</a>
      <a href="/products">Produtos</a>
      <a href="/categories">Categorias</a>
      <a href="/">Ofertas</a>
      <a href="/about-us">Sobre</a>
    </nav>
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="headerSearch" placeholder="Buscar produtos..." oninput="renderProducts()">
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="Lista de desejos" onclick="openFav()">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="hd-badge" id="wishBadge" style="display:none">0</span>
      </button>
      <button class="icon-btn" title="Abrir carrinho" onclick="openCart()">
        <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="hd-badge" id="cartBadge">0</span>
      </button>
      <button class="btn-account" onclick="buttonLink('/login')">
        <svg style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Entrar
      </button>
	  <button class="icon-btn" title="Abrir menu" onclick="openMore()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    	  <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  		</svg>
      </button>
    </div>
  </div>
</header>
<!-- <header>
	<div id="header-index"></div>
</header> -->

<script>
    fetch('../files/no-login/header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-index').innerHTML = data;
        });
</script>
	
<script>
    fetch('../files/no-login/index.html')
        .then(response => {
            if (!response.ok) throw new Error("Erro ao carregar o arquivo");
            return response.text();
        })
        .then(data => {
            document.getElementById('index-content').innerHTML = data;
			
            const script = document.createElement('script');
            script.src = '../files/no-login/script.js';
            document.body.appendChild(script);
        })
        .catch(error => {
            console.error("Erro no carregamento:", error);
            document.getElementById('index-content').innerHTML = "<h1>Erro ao carregar a página. Verifique o console.</h1>";
        });
</script>
</body>
</html>
