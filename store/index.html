<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecomme</title>
	
  <link rel="icon" id="favicon" type="image/png" href="/images/favicon-light.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Marck+Script&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/files/styles/pages/store.css">
  <script src="/files/scripts/html-imports.js"></script>
</head>
<body>
<body class="store-loading">
    
  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <button onclick="window.scrollTo({top:0,behavior:'smooth'})">
          <img src="/images/mainlogo.png" style="position: relative; top: 0px; width: 200px; height: auto; display: block;" alt="Ecomme"/>
        </button>
      </div>
      <nav class="nav-main">
        <a href="/">Início</a>
        <a href="/products">Produtos</a>
        <a href="/categories">Categorias</a>
        <a href="/offers">Ofertas</a>
        <a href="/about-us">Sobre</a>
      </nav>
      <div class="search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="headerSearch" placeholder="Buscar produtos..." oninput="onHeaderSearch(this)">
      </div>
      <div class="header-actions">
        <button class="icon-btn hidden" id="bellBtn" title="Notificações" onclick="openNotif()">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="hd-badge" id="bellBadge" style="display:none">0</span>
        </button>
        <button class="icon-btn" title="Lista de desejos" onclick="openFav()">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="hd-badge" id="wishBadge" style="display:none">0</span>
        </button>
        <button class="icon-btn" title="Abrir carrinho" onclick="openCart()">
          <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="hd-badge" id="cartBadge" style="display:none">0</span>
        </button>
        <button id="authLoginBtn" class="btn-account" onclick="buttonLink('/login')">
          <svg style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Entrar
        </button>
        <button class="icon-btn" title="Abrir menu" onclick="openMore()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="headerProfileContainer" class="header-profile hidden" onclick="openAcc()">
          <img id="headerAvatar" src="/images/icons/full/user.webp" alt="Perfil">
        </div>
      </div>
    </div>
  </header>
  
<!-- BREADCRUMB -->
<div class="breadcrumb-bar">
  <div class="breadcrumb">
    <a href="/">Início</a><span class="sep">/</span>
    <a href="/products">Produtos</a><span class="sep">/</span>
    <span class="cur" id="crumbStore">Loja</span>
  </div>
</div>

<!-- ══ SELLER BANNER ════════════════════════════════════════ -->
<div class="seller-banner">
  <div class="sb-grid-bg"></div>
  <div class="sb-orb1"></div>
  <div class="sb-orb2"></div>
  <div class="sb-particles" id="particles"></div>
  <div class="sb-glow-line"></div>
</div>

<!-- ══ PROFILE IDENTITY ═════════════════════════════════════ -->
<div class="profile-identity">
  <div class="pi-inner">
    <div class="pi-top">
      <!-- Avatar -->
      <div class="pi-avatar-wrap">
        <div class="pi-avatar"><span class="store-skeleton-shimmer store-skeleton-avatar" aria-hidden="true"></span></div>
        
      </div>

      <!-- Info -->
      <div class="pi-info">
        <div class="pi-name-row">
          <span class="pi-name"><span class="store-skeleton-shimmer store-skeleton-name" aria-hidden="true"></span></span>
        </div>
        <div class="pi-handle"><span class="store-skeleton-shimmer store-skeleton-handle" aria-hidden="true"></span></div>
        <div class="pi-desc store-skeleton-desc" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-desc-line"></span><span class="store-skeleton-shimmer store-skeleton-desc-line store-skeleton-desc-short"></span></div>
      </div>

      <!-- Actions -->
      <div class="pi-actions">
        <!-- Share -->
        <button class="btn-share" onclick="handleShare()" title="Compartilhar perfil">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="pi-stats" id="storeStats" aria-hidden="true">
      <div class="pi-stat store-skeleton-stat"><span class="store-skeleton-shimmer store-skeleton-stat-value"></span><span class="store-skeleton-shimmer store-skeleton-stat-label"></span><span class="store-skeleton-shimmer store-skeleton-stat-sub"></span></div>
      <div class="pi-stat store-skeleton-stat"><span class="store-skeleton-shimmer store-skeleton-stat-value store-skeleton-stat-value-short"></span><span class="store-skeleton-shimmer store-skeleton-stat-label"></span><span class="store-skeleton-shimmer store-skeleton-stat-sub"></span></div>
      <div class="pi-stat store-skeleton-stat"><span class="store-skeleton-shimmer store-skeleton-stat-value store-skeleton-stat-value-mid"></span><span class="store-skeleton-shimmer store-skeleton-stat-label"></span><span class="store-skeleton-shimmer store-skeleton-stat-sub"></span></div>
    </div>
  </div>
</div>

<!-- ══ CONTENT TABS ══════════════════════════════════════════ -->
<div class="tab-bar">
  <div class="tab-inner" id="tabBar">
    <span class="tab-pill-bg" id="tabPill"></span>
    <button class="tab-btn on" data-tab="products" onclick="switchTab(this,'products')">
      Produtos <span class="tab-badge" id="tabCountProducts">0</span>
    </button>
    <button class="tab-btn" data-tab="reviews" onclick="switchTab(this,'reviews')">
      Avaliações <span class="tab-badge" id="tabCountReviews">0</span>
    </button>
    <button class="tab-btn" data-tab="about" onclick="switchTab(this,'about')">
      Sobre o Vendedor <span class="tab-badge">ℹ</span>
    </button>
  </div>
</div>

<!-- ══ MAIN CONTENT ══════════════════════════════════════════ -->
<div class="main-wrap">

  <!-- ── PRODUCTS PANEL ──────────────────────────────────── -->
  <div class="panel on" id="panel-products">
    <div class="prod-toolbar">
      <div class="pt-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="prodSearch" placeholder="Buscar produtos deste vendedor..." oninput="filterProds()">
      </div>
      <select class="pt-sel" id="prodSort" onchange="filterProds()">
        <option value="pop">Mais Populares</option>
        <option value="price_asc">Menor Preço</option>
        <option value="price_desc">Maior Preço</option>
        <option value="new">Mais Recentes</option>
        <option value="rating">Mais Avaliados</option>
      </select>
    </div>
    <div class="prod-grid" id="prodGrid" aria-busy="true">
      <div class="store-skeleton-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-product-image"></span><div class="store-skeleton-product-info"><span class="store-skeleton-shimmer store-skeleton-product-line"></span><span class="store-skeleton-shimmer store-skeleton-product-line store-skeleton-product-line-short"></span><span class="store-skeleton-shimmer store-skeleton-product-price"></span></div></div>
      <div class="store-skeleton-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-product-image"></span><div class="store-skeleton-product-info"><span class="store-skeleton-shimmer store-skeleton-product-line"></span><span class="store-skeleton-shimmer store-skeleton-product-line store-skeleton-product-line-short"></span><span class="store-skeleton-shimmer store-skeleton-product-price"></span></div></div>
      <div class="store-skeleton-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-product-image"></span><div class="store-skeleton-product-info"><span class="store-skeleton-shimmer store-skeleton-product-line"></span><span class="store-skeleton-shimmer store-skeleton-product-line store-skeleton-product-line-short"></span><span class="store-skeleton-shimmer store-skeleton-product-price"></span></div></div>
      <div class="store-skeleton-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-product-image"></span><div class="store-skeleton-product-info"><span class="store-skeleton-shimmer store-skeleton-product-line"></span><span class="store-skeleton-shimmer store-skeleton-product-line store-skeleton-product-line-short"></span><span class="store-skeleton-shimmer store-skeleton-product-price"></span></div></div>
      <div class="store-skeleton-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-product-image"></span><div class="store-skeleton-product-info"><span class="store-skeleton-shimmer store-skeleton-product-line"></span><span class="store-skeleton-shimmer store-skeleton-product-line store-skeleton-product-line-short"></span><span class="store-skeleton-shimmer store-skeleton-product-price"></span></div></div>
      <div class="store-skeleton-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-product-image"></span><div class="store-skeleton-product-info"><span class="store-skeleton-shimmer store-skeleton-product-line"></span><span class="store-skeleton-shimmer store-skeleton-product-line store-skeleton-product-line-short"></span><span class="store-skeleton-shimmer store-skeleton-product-price"></span></div></div>
      <div class="store-skeleton-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-product-image"></span><div class="store-skeleton-product-info"><span class="store-skeleton-shimmer store-skeleton-product-line"></span><span class="store-skeleton-shimmer store-skeleton-product-line store-skeleton-product-line-short"></span><span class="store-skeleton-shimmer store-skeleton-product-price"></span></div></div>
      <div class="store-skeleton-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-product-image"></span><div class="store-skeleton-product-info"><span class="store-skeleton-shimmer store-skeleton-product-line"></span><span class="store-skeleton-shimmer store-skeleton-product-line store-skeleton-product-line-short"></span><span class="store-skeleton-shimmer store-skeleton-product-price"></span></div></div>
    </div>
  </div>

  <!-- ── REVIEWS PANEL ────────────────────────────────────── -->
  <div class="panel" id="panel-reviews">
      <div id="reviewsContent" aria-busy="true">
        <div class="store-reviews-skeleton" aria-hidden="true"><div class="store-skeleton-review-summary"><span class="store-skeleton-shimmer store-skeleton-review-score"></span><span class="store-skeleton-shimmer store-skeleton-review-line"></span><span class="store-skeleton-shimmer store-skeleton-review-line store-skeleton-review-line-short"></span></div><div class="store-skeleton-review-list"><div class="store-skeleton-review-card"><span class="store-skeleton-shimmer store-skeleton-review-line"></span><span class="store-skeleton-shimmer store-skeleton-review-line store-skeleton-review-line-mid"></span></div><div class="store-skeleton-review-card"><span class="store-skeleton-shimmer store-skeleton-review-line"></span><span class="store-skeleton-shimmer store-skeleton-review-line store-skeleton-review-line-short"></span></div></div></div>
      </div>
    </div>

  <!-- ── ABOUT PANEL ──────────────────────────────────────── -->
  <div class="panel" id="panel-about">
    <div class="about-grid" id="aboutGrid" aria-busy="true">
      <div class="about-card store-skeleton-about-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-about-title"></span><span class="store-skeleton-shimmer store-skeleton-about-line"></span><span class="store-skeleton-shimmer store-skeleton-about-line"></span><span class="store-skeleton-shimmer store-skeleton-about-line store-skeleton-about-line-short"></span></div>
      <div class="about-card store-skeleton-about-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-about-title"></span><span class="store-skeleton-shimmer store-skeleton-about-line"></span><span class="store-skeleton-shimmer store-skeleton-about-line"></span><span class="store-skeleton-shimmer store-skeleton-about-line store-skeleton-about-line-short"></span></div>
      <div class="about-card store-skeleton-about-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-about-title"></span><span class="store-skeleton-shimmer store-skeleton-about-line"></span><span class="store-skeleton-shimmer store-skeleton-about-line store-skeleton-about-line-short"></span></div>
      <div class="about-card store-skeleton-about-card" aria-hidden="true"><span class="store-skeleton-shimmer store-skeleton-about-title"></span><span class="store-skeleton-shimmer store-skeleton-about-line"></span><span class="store-skeleton-shimmer store-skeleton-about-line"></span></div>
    </div>
  </div>

  <!-- ── SIDEBAR ───────────────────────────────────────────── -->
  <div class="sidebar-col" id="sidebarCol" hidden></div>
</div>

  <!-- CARREGANDO / ERRO DA LOJA -->
  <div id="storeLoader" class="store-loader" role="status" aria-live="polite" hidden>
    <div class="store-loader-spinner"></div><p>Carregando loja...</p>
  </div>
  <div id="storeError" class="store-error" role="alert" hidden>
    <div class="store-error-card">
      <h2>Não foi possível carregar a loja</h2>
      <p id="storeErrorMsg">Tente novamente em instantes.</p>
      <button class="btn-retry-store" onclick="retryLoadStore()">Tentar novamente</button>
    </div>
  </div>


  <!-- TOAST -->
  <div class="toast" id="toast">
    <div class="toast-icon">✓</div>
    <span id="toastMsg">Produto adicionado!</span>
  </div>

  <!-- BACK TO TOP -->
  <button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

<!-- QUICKLINK -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/quicklink/2.3.0/quicklink.umd.js"></script>
<script>
  // Start the Quicklink
  window.addEventListener('load', () => {
    quicklink.listen();
  });
</script>
  
<script src="/files/scripts/imports.js"></script>
<script src="/files/scripts/pages/store.js"></script>
</body>
</html>
