<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Compras | Ecomme</title>

  <link rel="icon" id="favicon" type="image/png" href="../images/favicon-light.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/files/no-login/light-theme/styles.css">
  <link rel="stylesheet" href="/files/login-on/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Marck+Script&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
</head>
<body>

<div id="index-topbar"></div>
<header id="index-header"></header>
	
<!-- BREADCRUMB -->
<div class="breadcrumb-bar">
  <div class="breadcrumb">
    <a href="/">Início</a>
    <span class="sep">/</span>
    <span class="cur">Minhas Compras</span>
  </div>
</div>

<!-- ACCOUNT HERO -->
<section class="acc-hero">
  <div class="acc-hero-inner">
    <div>
      <h1>Minhas Compras</h1>
      <p>Acompanhe o histórico completo das suas compras, <br>rastreie entregas e compre de novo em poucos cliques.</p>
    </div>
    <div class="acc-user">
      <div class="acc-user-avatar">
		<img src="../images/icons/full/user.webp" style="width: 25px; height: auto; display: block; filter: brightness(0) invert(1) drop-shadow(0 0 8px rgba(255,255,255,.5));" alt="User"/>
	  </div>
      <div>
        <div class="acc-user-name">Minha Conta</div>
        <div class="acc-user-email">minha.conta@abc.com</div>
      </div>
    </div>
  </div>
</section>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-card c1">
    <div class="stat-ico"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
    <div><strong id="statTotal">0</strong><span>Total de Pedidos</span></div>
  </div>
  <div class="stat-card c2">
    <div class="stat-ico"><svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
    <div><strong id="statProgress">0</strong><span>Em Andamento</span></div>
  </div>
  <div class="stat-card c3">
    <div class="stat-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="16 10 11 15 8 12"/></svg></div>
    <div><strong id="statDelivered">0</strong><span>Entregues</span></div>
  </div>
  <div class="stat-card c4">
    <div class="stat-ico"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
    <div><strong id="statSpent">R$ 0,00</strong><span>Total Investido</span></div>
  </div>
</div>

<!-- ORDERS -->
<section class="orders-section">

  <div class="orders-toolbar">
    <div class="ot-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar por número do pedido ou produto..." oninput="renderOrders()">
    </div>
    <select class="ot-sel" id="statusFilter" onchange="renderOrders()">
      <option value="todos">Todos os status</option>
      <option value="andamento">Em andamento</option>
      <option value="entregue">Entregues</option>
      <option value="cancelado">Cancelados</option>
    </select>
    <select class="ot-sel" id="sortSelect" onchange="renderOrders()">
      <option value="recentes">Mais recentes</option>
      <option value="antigos">Mais antigos</option>
      <option value="maior">Maior valor</option>
      <option value="menor">Menor valor</option>
    </select>
    <span class="ot-count" id="resultCount">0 pedidos</span>
  </div>

  <div class="orders-list" id="ordersList"></div>
</section>

<footer id="index-footer"></footer>
<div id="index-sidebars"></div>

<!-- --LOGIN ON------------------------------------------------ -->

<script>
  async function loadComponents() {
    try {
      const [topbarRes, headerRes, footerRes, sidebarsRes] = await Promise.all([
        fetch('/files/no-login/index-files/topbar.html'),
        fetch('/files/login-on/index-files/header.html'),
        fetch('/files/no-login/index-files/footer.html'),
        fetch('/files/no-login/index-files/sidebars.html')
      ]);

      const topbarHTML = await topbarRes.text();
      const headerHTML = await headerRes.text();
      const footerHTML = await footerRes.text();
      const sidebarsHTML = await sidebarsRes.text();

      document.getElementById('index-topbar').innerHTML = topbarHTML;
      document.getElementById('index-header').innerHTML = headerHTML;
      document.getElementById('index-footer').innerHTML = footerHTML;
      document.getElementById('index-sidebars').innerHTML = sidebarsHTML;

      const sidebarScript = document.createElement('script');
      sidebarScript.src = '/files/no-login/scripts/script.js';
      document.body.appendChild(sidebarScript);

      const mainScript = document.createElement('script');
      mainScript.src = 'script.js';
      document.body.appendChild(mainScript);

    } catch (error) {
      console.error("Erro no carregamento dos componentes:", error);
      document.getElementById('index-header').innerHTML = "<h1>Erro ao carregar a interface. Verifique o console.</h1>";
    }
  }
  loadComponents();
</script>
	
</body>
</html>
