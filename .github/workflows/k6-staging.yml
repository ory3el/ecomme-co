name: Ecomme - Diagnóstico de APIs (staging)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL HTTPS do ambiente de staging (não use produção)'
        required: true
        type: string
      product_id:
        description: 'ID de um produto público para diagnóstico (opcional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnosticar APIs públicas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Validar destino e credenciais
        env:
          BASE_URL: ${{ inputs.base_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          if [[ "$BASE_URL" != https://* ]]; then
            echo '::error::Informe uma URL HTTPS de staging.'
            exit 1
          fi
          if [[ "$BASE_URL" == 'https://ecomme-co.pages.dev' || "$BASE_URL" == 'https://ecomme.com' || "$BASE_URL" == 'https://www.ecomme.com' || "$BASE_URL" == https://*.ecomme.com ]]; then
            echo '::error::Domínio de produção bloqueado. Use o Preview de staging.'
            exit 1
          fi
          if [[ -z "${CF_ACCESS_CLIENT_ID:-}" || -z "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            echo '::error::Configure CF_ACCESS_CLIENT_ID e CF_ACCESS_CLIENT_SECRET em Settings > Secrets and variables > Actions.'
            exit 1
          fi
          echo "Destino validado: $BASE_URL"

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Diagnosticar respostas das APIs
        env:
          BASE_URL: ${{ inputs.base_url }}
          PRODUCT_ID: ${{ inputs.product_id }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          k6 version
          k6 run --summary-export=api-diagnostic-summary.json tests/load/ecomme-api-diagnostic.js

      - name: Salvar diagnóstico
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ecomme-k6-api-diagnostic
          path: api-diagnostic-summary.json
          if-no-files-found: ignore
          retention-days: 14
