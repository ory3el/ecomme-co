name: Ecomme - Diagnóstico de APIs (staging)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL HTTPS do ambiente de staging (não use produção)'
        required: true
        type: string
      product_id:
        description: 'ID de um produto público para diagnóstico (opcional)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnosticar APIs públicas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Validar destino e credenciais
        env:
          BASE_URL: ${{ inputs.base_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          if [[ "$BASE_URL" != https://* ]]; then
            echo '::error::Informe uma URL HTTPS de staging.'
            exit 1
          fi
          if [[ "$BASE_URL" == 'https://ecomme-co.pages.dev' || "$BASE_URL" == 'https://ecomme.com' || "$BASE_URL" == 'https://www.ecomme.com' ]]; then
            echo '::error::Domínio de produção bloqueado. Use o Preview de staging.'
            exit 1
          fi
          if [[ -z "${CF_ACCESS_CLIENT_ID:-}" || -z "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            echo '::error::Configure CF_ACCESS_CLIENT_ID e CF_ACCESS_CLIENT_SECRET nos GitHub Actions Secrets.'
            exit 1
          fi
          echo "Destino validado: $BASE_URL"

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Criar script de diagnóstico no runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/load
          cat > tests/load/ecomme-api-diagnostic.js <<'K6SCRIPT'
          import http from 'k6/http';
          import { check } from 'k6';

          const BASE_URL = String(__ENV.BASE_URL || '').replace(/\/+$/, '');
          const PRODUCT_ID = String(__ENV.PRODUCT_ID || '').trim();
          const ACCESS_CLIENT_ID = String(__ENV.CF_ACCESS_CLIENT_ID || '').trim();
          const ACCESS_CLIENT_SECRET = String(__ENV.CF_ACCESS_CLIENT_SECRET || '').trim();

          if (!BASE_URL) throw new Error('Defina BASE_URL com a URL do staging.');
          if (!ACCESS_CLIENT_ID || !ACCESS_CLIENT_SECRET) {
            throw new Error('Configure CF_ACCESS_CLIENT_ID e CF_ACCESS_CLIENT_SECRET.');
          }

          const HEADERS = {
            'CF-Access-Client-Id': ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret': ACCESS_CLIENT_SECRET,
            'Accept': 'application/json',
          };

          export const options = { vus: 1, iterations: 1 };

          function classifyBody(body) {
            const value = String(body || '').trim();
            if (!value) return { kind: 'empty', preview: '' };
            try {
              JSON.parse(value);
              return { kind: 'valid-json', preview: '' };
            } catch (_) {
              const compact = value.replace(/\s+/g, ' ').slice(0, 220);
              if (/^<!doctype html|^<html[\s>]/i.test(value)) return { kind: 'html', preview: compact };
              return { kind: 'not-json', preview: compact };
            }
          }

          function probe(label, path) {
            const response = http.get(`${BASE_URL}${path}`, {
              headers: HEADERS,
              redirects: 5,
              timeout: '20s',
              tags: { endpoint: label, test_type: 'preflight' },
            });
            const contentType = String(response.headers['Content-Type'] || response.headers['content-type'] || 'missing');
            const body = classifyBody(response.body);
            const report = {
              endpoint: label,
              status: response.status,
              content_type: contentType,
              body_type: body.kind,
              duration_ms: Math.round(response.timings.duration * 100) / 100,
            };
            if (body.preview) report.body_preview = body.preview;
            console.log(`API_DIAGNOSTIC ${JSON.stringify(report)}`);
            check(response, {
              [`${label}: HTTP 200`]: (r) => r.status === 200,
              [`${label}: valid JSON`]: () => body.kind === 'valid-json',
            });
          }

          export default function () {
            probe('catalog', '/api/catalog?mode=products&sort=rating&limit=25&seed=diagnostic');
            probe('search', '/api/search?q=produto&page=1&limit=12');
            probe('catalog-stats', '/api/catalog-stats?type=categories');
            if (PRODUCT_ID) probe('product-detail', `/api/product/${encodeURIComponent(PRODUCT_ID)}`);
          }
          K6SCRIPT
          test -s tests/load/ecomme-api-diagnostic.js
          echo 'Script de diagnóstico criado no runner.'

      - name: Diagnosticar respostas das APIs
        env:
          BASE_URL: ${{ inputs.base_url }}
          PRODUCT_ID: ${{ inputs.product_id }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          k6 version
          k6 run --summary-export=api-diagnostic-summary.json tests/load/ecomme-api-diagnostic.js

      - name: Salvar diagnóstico
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ecomme-k6-api-diagnostic
          path: api-diagnostic-summary.json
          if-no-files-found: ignore
          retention-days: 14
