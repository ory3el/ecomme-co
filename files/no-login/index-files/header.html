<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="logo">
       <button onclick="window.scrollTo({top:0,behavior:'smooth'})">
         <img src="/images/mainlogo.png" style="position: relative; top: 0px; width: 200px; height: auto; display: block;" alt="Ecomme"/>
       </button>
    </div>
    <nav class="nav-main">
      <a href="/">Início</a>
      <a href="/products">Produtos</a>
      <a href="/categories">Categorias</a>
      <a href="/offers">Ofertas</a>
      <a href="/about-us">Sobre</a>
    </nav>
	<div class="search-bar">
  	  <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  	  <input type="text" id="headerSearch" placeholder="Buscar produtos..." oninput="if(typeof renderProducts === 'function') renderProducts()">
	</div>
    <div class="header-actions">
      <button class="icon-btn" title="Lista de desejos" onclick="openFav()">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="hd-badge" id="wishBadge" style="display:none">0</span>
      </button>
      <button class="icon-btn" title="Abrir carrinho" onclick="openCart()">
        <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="hd-badge" id="cartBadge">0</span>
      </button>
      <button class="btn-account" onclick="buttonLink('/login')">
        <svg style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Entrar
      </button>
	  <button class="icon-btn" title="Abrir menu" onclick="openMore()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    	  <path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  		</svg>
      </button>
    </div>
  </div>
</header>
