<!DOCTYPE html>
<html lang="pt" data-lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06070c">
<meta name="description" content="Selecione seu país para acessar a versão local da plataforma.">
<title>Ecomme — Escolha seu país</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     RESET & BASE
     html/body are locked to the viewport height with overflow
     hidden — this guarantees the page itself never scrolls,
     at any resolution, as required by the brief.
  ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #06070c;
    color: #f3f4f8;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    height: 100vh;
    height: 100dvh; /* falls back gracefully to 100vh on old browsers */
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  ul { list-style: none; }
  svg { display: block; }

  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid #8b8bff;
    outline-offset: 3px;
    border-radius: 6px;
  }

  ::selection { background: #6366f1; color: #fff; }

  /* ============================================================
     BACKGROUND — soft animated gradient blobs + technical grid
  ============================================================ */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #12142a 0%, #06070c 55%);
  }

  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%);
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .38;
    will-change: transform;
  }
  .blob-a {
    width: 46vw; height: 46vw; max-width: 620px; max-height: 620px;
    top: -14%; left: -10%;
    background: radial-gradient(circle, #6366f1 0%, transparent 70%);
    animation: drift-a 24s ease-in-out infinite alternate;
  }
  .blob-b {
    width: 40vw; height: 40vw; max-width: 560px; max-height: 560px;
    bottom: -16%; right: -8%;
    background: radial-gradient(circle, #22d3ee 0%, transparent 70%);
    animation: drift-b 28s ease-in-out infinite alternate;
  }
  .blob-c {
    width: 30vw; height: 30vw; max-width: 420px; max-height: 420px;
    bottom: 10%; left: 30%;
    background: radial-gradient(circle, #d946ef 0%, transparent 70%);
    opacity: .22;
    animation: drift-c 32s ease-in-out infinite alternate;
  }

  @keyframes drift-a {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6%, 8%) scale(1.12); }
  }
  @keyframes drift-b {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-8%, -6%) scale(1.08); }
  }
  @keyframes drift-c {
    from { transform: translate(-50%, 0) scale(1); }
    to   { transform: translate(-50%, -10%) scale(1.15); }
  }

  /* ============================================================
     CUSTOM CURSOR GLOW — desktop, fine-pointer only, purely
     decorative (pointer-events:none, real cursor stays visible)
  ============================================================ */
  .cursor-glow {
    position: fixed;
    top: 0; left: 0;
    width: 240px; height: 240px;
    margin-left: -120px; margin-top: -120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,.16) 0%, transparent 70%);
    pointer-events: none;
    z-index: 1;
    display: none;
    transform: translate3d(-999px, -999px, 0);
  }
  @media (hover: hover) and (pointer: fine) {
    .cursor-glow.active { display: block; }
  }

  /* ============================================================
     PAGE SHELL
  ============================================================ */
  .page {
    position: relative;
    z-index: 2;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(18px, 3.4vw, 40px) clamp(20px, 4vw, 56px);
    gap: clamp(6px, 1.6vh, 18px);
    opacity: 0;
    transform: translateY(10px);
    animation: page-in .7s cubic-bezier(.16,1,.3,1) .05s forwards;
  }
  @keyframes page-in {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============================================================
     HEADER
  ============================================================ */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    -webkit-tap-highlight-color: transparent;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, #6366f1, #22d3ee);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; color: #06070c;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(99,102,241,.35);
  }
  .brand-name {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
    color: #f3f4f8;
  }

  /* language switcher */
  .lang-switcher { position: relative; }

  .lang-toggle {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.10);
    padding: 8px 12px 8px 10px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    color: #e4e5ee;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: background .3s, border-color .3s, transform .3s;
    touch-action: manipulation;
  }
  .lang-toggle:hover {
    background: rgba(255,255,255,.09);
    border-color: rgba(255,255,255,.2);
  }
  .lang-toggle svg { width: 15px; height: 15px; stroke: #a9abc0; flex-shrink: 0; }
  .lang-toggle .chev {
    width: 11px; height: 11px; stroke: #7d7f95;
    transition: transform .3s cubic-bezier(.4,0,.2,1);
  }
  .lang-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .lang-code { min-width: 18px; text-align: center; }

  .lang-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 190px;
    background: rgba(18,19,32,.85);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    padding: 6px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 20px 50px -12px rgba(0,0,0,.6);
    opacity: 0;
    transform: translateY(-6px) scale(.97);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s cubic-bezier(.4,0,.2,1);
    z-index: 20;
  }
  .lang-menu:not([hidden]) {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .lang-menu[hidden] { display: block; } /* keep transition-able, JS also toggles opacity */

  .lang-option {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    background: none; border: none;
    color: #d3d4e2;
    transition: background .18s;
    text-align: left;
  }
  .lang-option:hover { background: rgba(255,255,255,.07); }
  .lang-option[aria-selected="true"] { color: #fff; font-weight: 700; }
  .lang-option .flag { font-size: 15px; }
  .lang-option .check {
    margin-left: auto;
    width: 14px; height: 14px;
    stroke: #22d3ee;
    opacity: 0;
  }
  .lang-option[aria-selected="true"] .check { opacity: 1; }

  /* ============================================================
     MAIN CONTENT
  ============================================================ */
  .content {
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: clamp(4px, 1vh, 8px);
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #8688a3;
    margin-bottom: clamp(6px, 1.2vh, 10px);
    opacity: 0;
    animation: fade-slide .6s cubic-bezier(.16,1,.3,1) .15s forwards;
  }

  .title {
    font-size: clamp(26px, 4.4vw, 50px);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.05;
    background: linear-gradient(180deg, #ffffff 20%, #b9bbd4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: clamp(8px, 1.4vh, 14px);
    opacity: 0;
    animation: fade-slide .7s cubic-bezier(.16,1,.3,1) .22s forwards;
  }

  .subtitle {
    font-size: clamp(12.5px, 1.5vw, 15px);
    color: #9799b3;
    max-width: 460px;
    line-height: 1.6;
    margin-bottom: clamp(18px, 3vh, 30px);
    opacity: 0;
    animation: fade-slide .7s cubic-bezier(.16,1,.3,1) .3s forwards;
  }

  @keyframes fade-slide {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============================================================
     COUNTRY GRID
     Hidden-scrollbar fallback: if 10 items don't fit the
     available height on very small screens, this region scrolls
     internally (touch / wheel / keyboard) instead of the page —
     no scrollbar is ever painted, on any browser.
  ============================================================ */
  .countries {
    width: 100%;
    max-width: 880px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
    gap: clamp(8px, 1.1vw, 12px);
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding: 2px; /* room for focus ring */
  }
  .countries::-webkit-scrollbar { display: none; }

  .country-card {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: clamp(11px, 1.3vw, 14px) clamp(13px, 1.5vw, 16px);
    border-radius: 14px;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.09);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    text-align: left;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
    cursor: pointer;
    opacity: 0;
    transform: translateY(14px);
    animation: card-in .55s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay: calc(380ms + (var(--i, 0) * 55ms));
    transition: transform .35s cubic-bezier(.2,.8,.2,1),
                box-shadow .35s cubic-bezier(.2,.8,.2,1),
                background-color .3s, border-color .3s;
  }
  @keyframes card-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .country-card:hover,
  .country-card:focus-visible {
    transform: translateY(-3px) scale(1.015);
    background: rgba(255,255,255,.065);
    border-color: rgba(255,255,255,.2);
    box-shadow: 0 16px 36px -14px rgba(99,102,241,.45);
  }
  .country-card:active { transform: translateY(-1px) scale(1.0); }

  .country-flag {
    font-size: clamp(19px, 2.1vw, 23px);
    line-height: 1;
    flex-shrink: 0;
  }
  .country-name {
    flex: 1;
    min-width: 0;
    font-size: clamp(12.5px, 1.25vw, 14px);
    font-weight: 600;
    color: #eceeF7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .country-go {
    width: 15px; height: 15px;
    stroke: #7d7f95;
    flex-shrink: 0;
    transition: transform .3s cubic-bezier(.4,0,.2,1), stroke .3s;
  }
  .country-card:hover .country-go,
  .country-card:focus-visible .country-go {
    transform: translate(2px, -2px);
    stroke: #cfd0e6;
  }

  /* ripple */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
    transform: scale(0);
    pointer-events: none;
    animation: ripple-anim .6s ease-out forwards;
  }
  @keyframes ripple-anim {
    to { transform: scale(3.4); opacity: 0; }
  }

  /* ============================================================
     FOOTER
  ============================================================ */
  .page-footer {
    text-align: center;
    font-size: clamp(10px, .95vw, 11.5px);
    color: #5c5e73;
    opacity: 0;
    animation: fade-slide .6s cubic-bezier(.16,1,.3,1) .5s forwards;
  }
  .page-footer a { color: #82849c; transition: color .25s; }
  .page-footer a:hover { color: #cfd0e6; }
  .footer-dot { margin: 0 8px; opacity: .5; }

  /* ============================================================
     TOAST
  ============================================================ */
  .toast {
    position: fixed;
    left: 50%;
    bottom: clamp(18px, 3.4vh, 34px);
    transform: translate(-50%, 16px);
    opacity: 0;
    pointer-events: none;
    background: rgba(18,19,32,.9);
    border: 1px solid rgba(255,255,255,.14);
    color: #f0f1f9;
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 100px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 12px 32px -8px rgba(0,0,0,.55);
    z-index: 50;
    display: flex; align-items: center; gap: 8px;
    transition: opacity .35s cubic-bezier(.4,0,.2,1), transform .35s cubic-bezier(.4,0,.2,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22d3ee;
    flex-shrink: 0;
    animation: pulse-dot 1s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; } 50% { opacity: .35; }
  }

  /* ============================================================
     RESPONSIVE TUNING
  ============================================================ */
  @media (max-width: 640px) {
    .countries { grid-template-columns: repeat(2, 1fr); }
    .brand-name { display: none; } /* keep header compact on phones */
    .lang-toggle .lang-code { display: inline; }
  }
  @media (max-width: 380px) {
    .countries { grid-template-columns: 1fr; }
  }
  @media (max-height: 560px) {
    .eyebrow { display: none; }
    .subtitle { margin-bottom: clamp(10px, 2vh, 16px); }
  }

  /* ============================================================
     ACCESSIBILITY — reduced motion
  ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
      scroll-behavior: auto !important;
    }
    .blob-a, .blob-b, .blob-c { animation: none !important; }
    .page, .eyebrow, .title, .subtitle, .page-footer, .country-card {
      opacity: 1 !important;
      transform: none !important;
    }
  }

  /* high-contrast safety: ensure text never drops below AA on the dark bg */
  @media (prefers-contrast: more) {
    body { background: #000; }
    .subtitle, .page-footer, .country-name { color: #fff; }
    .country-card { border-color: rgba(255,255,255,.4); }
  }
</style>
</head>
<body>

  <!-- decorative background layer -->
  <div class="bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <!-- decorative cursor glow (desktop only, non-interactive) -->
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <div class="page">

    <!-- ============ HEADER ============ -->
    <header class="page-header">
      <a href="#" class="brand" aria-label="Ecomme — página inicial">
        <span class="brand-mark" aria-hidden="true">e</span>
        <span class="brand-name">ecomme</span>
      </a>

      <div class="lang-switcher">
        <button type="button" class="lang-toggle" id="langToggle"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu"
                aria-label="Selecionar idioma">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/>
          </svg>
          <span class="lang-code" id="langCode">PT</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <ul class="lang-menu" id="langMenu" role="listbox" aria-label="Idiomas disponíveis" hidden>
          <li role="option" data-lang="pt" aria-selected="true">
            <button type="button" class="lang-option" data-lang="pt">
              <span class="flag">🇧🇷</span> Português
              <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </li>
          <li role="option" data-lang="en" aria-selected="false">
            <button type="button" class="lang-option" data-lang="en">
              <span class="flag">🇺🇸</span> English
              <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </li>
          <li role="option" data-lang="es" aria-selected="false">
            <button type="button" class="lang-option" data-lang="es">
              <span class="flag">🇪🇸</span> Español
              <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </li>
          <li role="option" data-lang="fr" aria-selected="false">
            <button type="button" class="lang-option" data-lang="fr">
              <span class="flag">🇫🇷</span> Français
              <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </li>
          <li role="option" data-lang="de" aria-selected="false">
            <button type="button" class="lang-option" data-lang="de">
              <span class="flag">🇩🇪</span> Deutsch
              <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </li>
        </ul>
      </div>
    </header>

    <!-- ============ MAIN ============ -->
    <main class="content">
      <p class="eyebrow" data-i18n="eyebrow">Selecione sua região</p>
      <h1 class="title" data-i18n="title">Escolha seu país</h1>
      <p class="subtitle" data-i18n="subtitle">Você será redirecionado para a versão local da plataforma, adaptada ao seu idioma, moeda e região.</p>

      <nav class="countries" id="countriesGrid" aria-label="Lista de países"></nav>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="page-footer">
      <span data-i18n="footer">© 2025 ecomme. Todos os direitos reservados.</span>
      <span class="footer-dot">·</span>
      <a href="#" data-i18n="privacy">Privacidade</a>
      <span class="footer-dot">·</span>
      <a href="#" data-i18n="terms">Termos</a>
    </footer>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-dot" aria-hidden="true"></span>
    <span id="toastText"></span>
  </div>

<script>
(function () {
  "use strict";

  /* ============================================================
     1. I18N DATA
     UI strings per language. Country names are also localized
     so the grid label always matches the selected UI language.
  ============================================================ */
  var STRINGS = {
    pt: {
      eyebrow: "Selecione sua região",
      title: "Escolha seu país",
      subtitle: "Você será redirecionado para a versão local da plataforma, adaptada ao seu idioma, moeda e região.",
      footer: "© 2025 ecomme. Todos os direitos reservados.",
      privacy: "Privacidade",
      terms: "Termos",
      redirecting: "Redirecionando para"
    },
    en: {
      eyebrow: "Select your region",
      title: "Choose your country",
      subtitle: "You'll be redirected to the local version of the platform, tailored to your language, currency and region.",
      footer: "© 2025 ecomme. All rights reserved.",
      privacy: "Privacy",
      terms: "Terms",
      redirecting: "Redirecting to"
    },
    es: {
      eyebrow: "Selecciona tu región",
      title: "Elige tu país",
      subtitle: "Serás redirigido a la versión local de la plataforma, adaptada a tu idioma, moneda y región.",
      footer: "© 2025 ecomme. Todos los derechos reservados.",
      privacy: "Privacidad",
      terms: "Términos",
      redirecting: "Redirigiendo a"
    },
    fr: {
      eyebrow: "Sélectionnez votre région",
      title: "Choisissez votre pays",
      subtitle: "Vous serez redirigé vers la version locale de la plateforme, adaptée à votre langue, devise et région.",
      footer: "© 2025 ecomme. Tous droits réservés.",
      privacy: "Confidentialité",
      terms: "Conditions",
      redirecting: "Redirection vers"
    },
    de: {
      eyebrow: "Wählen Sie Ihre Region",
      title: "Wählen Sie Ihr Land",
      subtitle: "Sie werden zur lokalen Version der Plattform weitergeleitet — angepasst an Sprache, Währung und Region.",
      footer: "© 2025 ecomme. Alle Rechte vorbehalten.",
      privacy: "Datenschutz",
      terms: "Bedingungen",
      redirecting: "Weiterleitung zu"
    }
  };

  var LANG_CODE_LABEL = { pt: "PT", en: "EN", es: "ES", fr: "FR", de: "DE" };

  var COUNTRIES = [
    { code: "br", flag: "🇧🇷", url: "https://br.ecomme.com",
      names: { pt: "Brasil", en: "Brazil", es: "Brasil", fr: "Brésil", de: "Brasilien" } },
    { code: "us", flag: "🇺🇸", url: "https://us.ecomme.com",
      names: { pt: "Estados Unidos", en: "United States", es: "Estados Unidos", fr: "États-Unis", de: "Vereinigte Staaten" } },
    { code: "ca", flag: "🇨🇦", url: "https://ca.ecomme.com",
      names: { pt: "Canadá", en: "Canada", es: "Canadá", fr: "Canada", de: "Kanada" } },
    { code: "uk", flag: "🇬🇧", url: "https://uk.ecomme.com",
      names: { pt: "Reino Unido", en: "United Kingdom", es: "Reino Unido", fr: "Royaume-Uni", de: "Vereinigtes Königreich" } },
    { code: "de", flag: "🇩🇪", url: "https://de.ecomme.com",
      names: { pt: "Alemanha", en: "Germany", es: "Alemania", fr: "Allemagne", de: "Deutschland" } },
    { code: "fr", flag: "🇫🇷", url: "https://fr.ecomme.com",
      names: { pt: "França", en: "France", es: "Francia", fr: "France", de: "Frankreich" } },
    { code: "it", flag: "🇮🇹", url: "https://it.ecomme.com",
      names: { pt: "Itália", en: "Italy", es: "Italia", fr: "Italie", de: "Italien" } },
    { code: "es", flag: "🇪🇸", url: "https://es.ecomme.com",
      names: { pt: "Espanha", en: "Spain", es: "España", fr: "Espagne", de: "Spanien" } },
    { code: "jp", flag: "🇯🇵", url: "https://jp.ecomme.com",
      names: { pt: "Japão", en: "Japan", es: "Japón", fr: "Japon", de: "Japan" } },
    { code: "au", flag: "🇦🇺", url: "https://au.ecomme.com",
      names: { pt: "Austrália", en: "Australia", es: "Australia", fr: "Australie", de: "Australien" } }
  ];

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var currentLang = "pt";

  /* ============================================================
     2. DOM REFERENCES
  ============================================================ */
  var $grid       = document.getElementById("countriesGrid");
  var $langToggle = document.getElementById("langToggle");
  var $langMenu   = document.getElementById("langMenu");
  var $langCode   = document.getElementById("langCode");
  var $toast      = document.getElementById("toast");
  var $toastText  = document.getElementById("toastText");
  var $cursorGlow = document.getElementById("cursorGlow");

  /* ============================================================
     3. RENDER — country grid
  ============================================================ */
  function renderCountries(lang) {
    $grid.innerHTML = "";
    COUNTRIES.forEach(function (country, i) {
      var name = country.names[lang];
      var card = document.createElement("a");
      card.href = country.url;
      card.className = "country-card";
      card.style.setProperty("--i", i);
      card.setAttribute("data-code", country.code);
      card.setAttribute("aria-label", name);

      card.innerHTML =
        '<span class="country-flag" aria-hidden="true">' + country.flag + '</span>' +
        '<span class="country-name">' + name + '</span>' +
        '<svg class="country-go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M7 17 17 7M9 7h8v8"/>' +
        '</svg>';

      card.addEventListener("click", function (e) { handleCountryClick(e, card, name); });
      $grid.appendChild(card);
    });
  }

  /* ripple + toast, then real navigation (respects modified clicks) */
  function handleCountryClick(e, card, name) {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();

    spawnRipple(e, card);
    showToast(STRINGS[currentLang].redirecting + " " + name + "…");

    var href = card.href;
    window.setTimeout(function () { window.location.href = href; }, 550);
  }

  function spawnRipple(e, card) {
    if (reduceMotion) return;
    var rect = card.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height) * 1.4;
    var span = document.createElement("span");
    span.className = "ripple";
    span.style.width = span.style.height = size + "px";
    span.style.left = (e.clientX - rect.left - size / 2) + "px";
    span.style.top  = (e.clientY - rect.top  - size / 2) + "px";
    card.appendChild(span);
    span.addEventListener("animationend", function () { span.remove(); }, { once: true });
  }

  /* ============================================================
     4. TOAST
  ============================================================ */
  var toastTimer = null;
  function showToast(msg) {
    $toastText.textContent = msg;
    $toast.classList.add("show");
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { $toast.classList.remove("show"); }, 1600);
  }

  /* ============================================================
     5. I18N — apply strings + swap language
  ============================================================ */
  function applyLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.setAttribute("data-lang", lang);

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (STRINGS[lang][key]) el.textContent = STRINGS[lang][key];
    });

    $langCode.textContent = LANG_CODE_LABEL[lang];

    document.querySelectorAll(".lang-option").forEach(function (btn) {
      var li = btn.closest("li");
      var selected = btn.getAttribute("data-lang") === lang;
      li.setAttribute("aria-selected", selected ? "true" : "false");
    });

    renderCountries(lang);
  }

  /* ============================================================
     6. LANGUAGE DROPDOWN — open/close + keyboard support
  ============================================================ */
  function openMenu() {
    $langMenu.hidden = false;
    $langToggle.setAttribute("aria-expanded", "true");
    var current = $langMenu.querySelector('.lang-option[data-lang="' + currentLang + '"]');
    if (current) current.focus();
  }
  function closeMenu(focusToggle) {
    $langMenu.hidden = true;
    $langToggle.setAttribute("aria-expanded", "false");
    if (focusToggle) $langToggle.focus();
  }
  function isMenuOpen() { return !$langMenu.hidden; }

  $langToggle.addEventListener("click", function () {
    isMenuOpen() ? closeMenu(false) : openMenu();
  });

  document.querySelectorAll(".lang-option").forEach(function (btn) {
    btn.addEventListener("click", function () {
      applyLanguage(btn.getAttribute("data-lang"));
      closeMenu(true);
    });
  });

  document.addEventListener("click", function (e) {
    if (isMenuOpen() && !e.target.closest(".lang-switcher")) closeMenu(false);
  });

  document.addEventListener("keydown", function (e) {
    if (!isMenuOpen()) return;
    var options = Array.prototype.slice.call(document.querySelectorAll(".lang-option"));
    var idx = options.indexOf(document.activeElement);

    if (e.key === "Escape") { closeMenu(true); }
    else if (e.key === "ArrowDown") { e.preventDefault(); options[(idx + 1) % options.length].focus(); }
    else if (e.key === "ArrowUp")   { e.preventDefault(); options[(idx - 1 + options.length) % options.length].focus(); }
    else if (e.key === "Home")      { e.preventDefault(); options[0].focus(); }
    else if (e.key === "End")       { e.preventDefault(); options[options.length - 1].focus(); }
  });

  /* ============================================================
     7. CURSOR GLOW — desktop only, smooth follow via rAF
  ============================================================ */
  var supportsFinePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  if (supportsFinePointer && !reduceMotion) {
    $cursorGlow.classList.add("active");
    var mx = -999, my = -999, cx = -999, cy = -999;
    window.addEventListener("mousemove", function (e) { mx = e.clientX; my = e.clientY; });
    (function loop() {
      cx += (mx - cx) * 0.16;
      cy += (my - cy) * 0.16;
      $cursorGlow.style.transform = "translate3d(" + cx + "px," + cy + "px,0)";
      window.requestAnimationFrame(loop);
    })();
  }

  /* ============================================================
     8. INIT
  ============================================================ */
  applyLanguage("pt");
})();
</script>
</body>
</html>
